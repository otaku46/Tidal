<!doctype html>
<html>
<head><meta charset="utf-8"><title>sample react - profile settings</title></head>
<body>
<div id="app"></div>
<script type="module">
import React, { useEffect, useRef, useState } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);
const KEY = "tidal-sample-profile";
const SAVE_MS = 600;

function readSaved() {
  try { return localStorage.getItem(KEY) ?? "Ada"; } catch { return "Ada"; }
}

function App() {
  const [saved, setSaved] = useState(readSaved);
  const [draft, setDraft] = useState(readSaved);
  // idle | saving | success | error
  const [phase, setPhase] = useState("idle");
  const [confirmDiscard, setConfirmDiscard] = useState(false);
  const request = useRef(0);

  const dirty = draft !== saved;
  const valid = draft.trim().length > 0;
  const status = phase === "saving" ? "saving"
    : phase === "error" ? "error"
    : dirty ? "dirty"
    : phase === "success" ? "saved" : "clean";

  // 保存済みの値だけを永続化する。未保存の draft はリロードで消える。
  useEffect(() => {
    try { localStorage.setItem(KEY, saved); } catch {}
  }, [saved]);

  // 未保存変更があるときだけ、リロード前に警告する。
  useEffect(() => {
    if (!dirty) return;
    const warn = (event) => { event.preventDefault(); event.returnValue = ""; };
    window.addEventListener("beforeunload", warn);
    return () => window.removeEventListener("beforeunload", warn);
  }, [dirty]);

  function edit(value) {
    setDraft(value);
    if (phase === "error" || phase === "success") setPhase("idle");
  }

  function save() {
    if (!dirty || !valid || phase === "saving") return;
    const id = ++request.current;
    const value = draft;
    setPhase("saving");
    setTimeout(() => {
      // 古いリクエストの応答は状態を書き換えない。
      if (id !== request.current) return;
      if (value.trim() === "fail") { setPhase("error"); return; }
      setSaved(value);
      setPhase("success");
    }, SAVE_MS);
  }

  function discard() {
    if (!dirty || phase === "saving") return;
    setConfirmDiscard(true);
  }

  function confirmDiscardChanges() {
    request.current += 1; // 保存中の応答も古いものとして扱う
    setDraft(saved);
    setPhase("idle");
    setConfirmDiscard(false);
  }

  return html`
    <div>
      <h1>Profile settings (React)</h1>
      <p data-testid="status">${status}</p>
      <p data-testid="dialog-state" data-state=${confirmDiscard ? "confirm" : "none"} hidden></p>
      <label>
        Name
        <input data-testid="draft-input" value=${draft} onChange=${(e) => edit(e.target.value)} />
      </label>
      <p data-testid="saved-value">${saved}</p>
      <p data-testid="validation">${valid ? "" : "Name is required"}</p>
      <p data-testid="error">${phase === "error" ? "Save failed" : ""}</p>
      <button data-testid="save" disabled=${!dirty || !valid || phase === "saving"}
        onClick=${save}>${phase === "saving" ? "Saving..." : "Save"}</button>
      <button data-testid="discard" disabled=${!dirty || phase === "saving"} onClick=${discard}>Discard</button>
      ${confirmDiscard && html`
        <div role="dialog" data-testid="discard-dialog">
          <p>Discard unsaved changes?</p>
          <button data-testid="discard-cancel" onClick=${() => setConfirmDiscard(false)}>Cancel</button>
          <button data-testid="discard-confirm" onClick=${confirmDiscardChanges}>Discard</button>
        </div>`}
    </div>`;
}

createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
