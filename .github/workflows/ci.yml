name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Build fixtures
        run: npm run build:fixtures

      - name: Run tests (golden + browser acceptance)
        run: npm test

      - name: Generate tidal report (mock fixture)
        if: always()
        run: |
          node src/cli.ts examples/draft-retention.spec.json \
            --binding examples/draft-retention.binding.json \
            --fixture retains \
            --out tidal-report.json || true

      - name: Upload tidal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-report
          path: tidal-report.json
          if-no-files-found: ignore
