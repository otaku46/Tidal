name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Build fixtures
        run: npm run build:fixtures

      - name: Run tests (golden + browser acceptance)
        run: npm test

      - name: Generate tidal report (mock fixture)
        if: always()
        run: |
          node src/cli.ts examples/draft-retention.spec.json \
            --binding examples/draft-retention.binding.json \
            --fixture retains \
            --out tidal-report.json || true

      - name: Generate save-conflict reports (naive + fixed)
        if: always()
        run: |
          node fixtures/server.mjs & echo $! > /tmp/fixture-server.pid
          for i in $(seq 1 50); do
            curl -sf http://localhost:4173/fixtures/apps/conflict/index.html > /dev/null && break
            sleep 0.1
          done
          node src/cli.ts examples/save-conflict.spec.json \
            --binding examples/save-conflict.naive.binding.json \
            --adapter playwright \
            --out tidal-report-conflict-naive.json || true
          node src/cli.ts examples/save-conflict.spec.json \
            --binding examples/save-conflict.fixed.binding.json \
            --adapter playwright \
            --out tidal-report-conflict-fixed.json || true
          kill $(cat /tmp/fixture-server.pid) || true

      - name: Upload tidal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tidal-reports
          path: |
            tidal-report.json
            tidal-report-conflict-naive.json
            tidal-report-conflict-fixed.json
          if-no-files-found: ignore
