require = ["mod.golden", "mod.adapter", "mod.runtime", "mod.cli"]

[meta]
name = "tidal_acceptance"
version = "0.1.0"
description = "Phase 4。AC-08 とランタイム受け入れ基準。"

[schema.FrameworkFixture]
kind = "node"
fields = { framework = "react|solid|svelte", binding = "schema.JsonValue" }

[func.verifyFrameworkFixtures]
intent = "同一の spec.json（draft-retention / disclosure）を React・Solid・Svelte のフィクスチャに適用する。"
input = ["schema.UxSpec", "schema.FrameworkFixture", "schema.GoldenExpectation"]
output = ["schema.Diagnostic"]
design_notes = "独立したサンプルアプリを共通 Playwright アダプターで操作・観測し、各アプリのロケーターは binding.json で指定する。draft-retention は react/solid/svelte の3 fixture、disclosure（panel 状態 + note 具体値オラクル、FR-28）も同じ3 fixture で検証する。binding は examples/disclosure.binding.json を共通定義とし、framework 別ファイルは extends で baseUrl のみ差し替える。さらに plan B の文書 playground（fixtures/apps/playground{,-lossy}、サーバー側 /api/docs に永続化）を doc-playground.spec.json で検証し、正常版 PASS・保存欠落版 implementation CONFIRMED を確認する。playground の binding も playground.binding.json を共通定義とし、ok/lossy は extends で baseUrl のみ差し替える。さらに plan C/D の保存競合 fixture（fixtures/apps/conflict{,-fixed}、共有 app.js、サーバー側 /api/docs が rev を返す）を save-conflict.spec.json で検証する。binding は mode=\"hold\" の network fixture（matchBody 必須）と release/expectHeld アクションで要求到着 A→B・応答解放 B→A を決定的に再現し、naive 版は独立オラクル（release_b/release_a 後の doc-body 生値と具体入力の比較）が no_stale_rollback を CONFIRMED、fixed 版は oracle/conformance が PASS。model target は spec が stale 適用を env 分岐として許容するため両版で CONFIRMED（neverTransition の反例イベント列が A→B 送信・B→A 応答順を示す）。naive/fixed の binding も extends で baseUrl のみ差し替える。 実装: verifyFrameworkFixtures(spec, fixture, expected, options?) は options.config/adapterFactory を取り Diagnostic[] を返す。照合は checkVerdictInvariants に委譲する。"
impl.lang = "ts"

[mod.acceptance]
purpose = "フレームワーク横断検証。共通モデル、共通アダプター、独立した具体値オラクルの受け入れ条件を確認する。"
schemas = ["schema.FrameworkFixture"]
funcs = ["func.verifyFrameworkFixtures"]
