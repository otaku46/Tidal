[meta]
name = "tidal_core"
version = "0.1.0"
description = "Phase 1。FR-01〜10、FR-19〜26、AC-01・06・10。TypeScript / Node.js。"

[schema.Scalar]
kind = "value"
type = "bool|int|string"
label = "有限値域の要素。整数は JavaScript の安全整数範囲。文字列は明示列挙する。"

[schema.JsonValue]
kind = "value"
type = "any"
label = "検証前の JSON 値。"

[schema.StateVariable]
kind = "node"
fields = { id = "string", domain = "schema.Scalar[]" }

[schema.StateValue]
kind = "node"
fields = { variable = "string", value = "schema.Scalar" }

[schema.AbstractState]
kind = "node"
fields = { values = "schema.StateValue[]" }

[schema.Expression]
kind = "node"
label = "op を識別子とするタグ付き式木。literal は value、ref は variable、not は引数1個、eq / ne / and / or は引数2個。"
fields = { op = "literal|ref|eq|ne|not|and|or", value = "schema.Scalar?", variable = "string?", args = "schema.Expression[]?" }

[schema.Event]
kind = "node"
role = "event"
fields = { id = "string", kind = "user|browser|env" }

[schema.UpdateMap]
kind = "value"
type = "any"
label = "変数 ID をキー、schema.Expression を値とする JSON オブジェクト。空オブジェクトを許可する。"

[schema.Transition]
kind = "node"
fields = { id = "string", event = "string", when = "schema.Expression", set = "schema.UpdateMap" }

[schema.GuardEventKind]
kind = "value"
type = "user|any"

[schema.Property]
kind = "node"
label = "from は前提。neverTransition は to と任意の unless を持つ。canReach は to、escapable は by を持つ。"
fields = { id = "string", kind = "neverTransition|canReach|escapable", from = "schema.Expression", to = "schema.Expression?", unless = "string?", by = "schema.GuardEventKind?" }

[schema.AnalysisLimits]
kind = "node"
role = "config"
fields = { maxStates = "int", maxDepth = "int", maxTransitions = "int" }

[schema.UxSpec]
kind = "node"
label = "外部 spec.json の契約。kind は tidal.uxSpec。schemaVersion の具体値は Q9 で確定する。"
fields = { schemaVersion = "string", kind = "string", states = "schema.StateVariable[]", initialState = "schema.AbstractState", events = "schema.Event[]", transitions = "schema.Transition[]", properties = "schema.Property[]", analysis = "schema.AnalysisLimits" }

[schema.DslDefinition]
kind = "node"
label = "TypeScript の宣言 API。変数 ID・値域・イベント ID を型で追跡し、式コンビネータで JSON 式木を構築する。"
fields = { specification = "schema.UxSpec" }

[schema.Diagnostic]
kind = "node"
role = "diagnostic"
fields = { code = "string", message = "string", path = "string?", target = "schema.Target?" }

[schema.ModelStep]
kind = "node"
fields = { from = "schema.AbstractState", event = "string", transition = "string", to = "schema.AbstractState" }

[schema.ModelGraph]
kind = "node"
fields = { initial = "schema.AbstractState", states = "schema.AbstractState[]", edges = "schema.ModelStep[]", deadlocks = "schema.AbstractState[]", unreachableEvents = "string[]", unexpanded = "schema.AbstractState[]", exhaustedLimits = "string[]", complete = "bool" }

[schema.Target]
kind = "value"
type = "model|conformance|implementation"

[schema.Verdict]
kind = "value"
type = "PASS|CONFIRMED|INCONCLUSIVE|FLAKY|ERROR"

[schema.Cause]
kind = "value"
type = "MODEL_DIVERGENCE|COVERAGE_SHORT|EXPLORATION_LIMIT|VACUOUS|UNEXPLAINED_CHANGE|ADAPTER_ERROR"

[schema.RunScope]
kind = "node"
role = "config"
fields = { targets = "schema.Target[]?" }

[schema.RunSelection]
kind = "node"
fields = { requested = "schema.RunScope", declared = "schema.Target[]" }

[schema.RunContext]
kind = "node"
role = "context"
fields = { scope = "schema.RunScope", declaredTargets = "schema.Target[]", effectiveTargets = "schema.Target[]", analysis = "schema.AnalysisLimits?", seed = "string?", environment = "any", reproduction = "any" }

[schema.Coverage]
kind = "node"
fields = { target = "schema.Target", states = "schema.AbstractState[]", transitions = "string[]", events = "string[]", evaluatedProperties = "string[]", missingObligations = "string[]", complete = "bool" }

[schema.Observation]
kind = "node"
fields = { state = "schema.AbstractState", provenance = "runner|app|unexplained", event = "string?" }

[schema.Counterexample]
kind = "node"
fields = { initial = "schema.AbstractState?", events = "string[]", modelSteps = "schema.ModelStep[]", observations = "schema.Observation[]", unreachableFrom = "schema.AbstractState?", exploredFromWitness = "schema.AbstractState[]?", expectedValue = "schema.Scalar?", actualValue = "schema.Scalar?", minimized = "bool" }

[schema.ReplayResult]
kind = "node"
fields = { attempt = "int", outcome = "MATCH|MISMATCH|ERROR", expectedValue = "schema.Scalar?", actualValue = "schema.Scalar?", diagnostic = "schema.Diagnostic?" }

[schema.Evidence]
kind = "node"
fields = { id = "string", kind = "MODEL_COUNTEREXAMPLE|INDEPENDENT_ORACLE|OBSERVATION_MISMATCH", counterexample = "schema.Counterexample", replay = "schema.ReplayResult[]", dependencies = "string[]" }

[schema.CheckResult]
kind = "node"
fields = { target = "schema.Target", property = "string", verdict = "schema.Verdict", causes = "schema.Cause[]", evidence = "schema.Evidence[]" }

[schema.NotEvaluated]
kind = "node"
fields = { target = "schema.Target", property = "string?", reason = "NOT_REQUESTED|BLOCKED|INCOMPLETE", cause = "schema.Cause?" }

[schema.RunResults]
kind = "node"
fields = { context = "schema.RunContext", results = "schema.CheckResult[]", coverage = "schema.Coverage[]", diagnostics = "schema.Diagnostic[]", notEvaluated = "schema.NotEvaluated[]" }

[schema.TargetResult]
kind = "node"
fields = { target = "schema.Target", verdict = "schema.Verdict?", properties = "schema.CheckResult[]" }

[schema.Report]
kind = "node"
role = "report"
fields = { schemaVersion = "string", context = "schema.RunContext", overall = "schema.Verdict", exitCode = "int", targets = "schema.TargetResult[]", confirmedViolations = "schema.CheckResult[]", errors = "schema.Diagnostic[]", notEvaluated = "schema.NotEvaluated[]", coverage = "schema.Coverage[]", evidence = "schema.Evidence[]", counterexamples = "schema.Counterexample[]", replayResults = "schema.ReplayResult[]" }

[func.compileSpec]
intent = "TypeScript DSL をバージョン付き JSON IR に変換する。"
input = ["schema.DslDefinition"]
output = ["schema.JsonValue"]
impl.lang = "ts"

[func.validateSpec]
intent = "JSON Schema による構造検証と、参照・型・有限値域の意味検証を行う。"
input = ["schema.JsonValue"]
output = ["schema.UxSpec", "schema.Diagnostic"]
design_notes = "対応する kind / schemaVersion とタグごとの必須フィールドを検査する。ID・値域の重複、初期値の過不足、未定義参照、型不一致を診断する。各変数の有限値域は単一の型とする。ガードとプロパティ述語は bool。比較は同じ型に限定し、値の暗黙変換を行わない。探索上限は安全整数で状態数は1以上、深度と遷移数は0以上。CLI の DSL 入力と JSON 入力で同じ検証を使う。"
impl.lang = "ts"

[func.evaluateExpression]
intent = "状態を参照して式木を純粋評価する。and / or は左から短絡評価する。"
input = ["schema.Expression", "schema.AbstractState"]
output = ["schema.Scalar", "schema.Diagnostic"]
impl.lang = "ts"

[func.expandState]
intent = "有効なイベントの遷移先を列挙する。"
input = ["schema.UxSpec", "schema.AbstractState"]
output = ["schema.ModelStep", "schema.Diagnostic"]
design_notes = "偽のガードを除外し、空の set を自己ループとして記録する。更新式はすべて遷移前状態で評価して同時適用し、値域外を仕様エラーにする。同じ状態とイベントで user / browser の候補が異なる状態へ進む場合は仕様エラーとし、同一結果への規則 ID はカバレッジに保持する。env の候補は全分岐を保持する。"
impl.lang = "ts"

[func.exploreModel]
intent = "到達可能な状態とラベル付き遷移を決定的な幅優先探索で列挙する。"
input = ["schema.UxSpec"]
output = ["schema.ModelGraph", "schema.Diagnostic"]
design_notes = "状態キーは変数 ID 順で正規化し、同じ深さでは発見順、出辺はイベント ID・遷移 ID 順とする。状態数は初期状態を含み、深度は初期状態を 0 とし、遷移数は自己ループを含む採用済み規則適用数。既知状態への辺も記録する。制限で出辺を省いた状態を未展開として保持する。デッドロックは有効イベントがゼロと判明した状態、到達不能イベントは完全探索で一度も有効にならなかったイベント。仕様エラーと探索不足を集約へ渡す。"
impl.lang = "ts"

[func.checkProperties]
intent = "探索グラフ上で neverTransition・canReach・escapable を評価し、プロパティ別証拠とカバレッジを出力する。"
input = ["schema.UxSpec", "schema.ModelGraph", "schema.RunContext"]
output = ["schema.RunResults"]
design_notes = "neverTransition は from を満たす遷移前状態と to を満たす遷移後状態を検査し、その辺のイベントが unless と一致する場合に除外する。canReach は各 from 状態から to への存在経路を検査し、長さ 0 を認める。escapable は各 from 状態から from の外へ出る経路を検査し、by=user では全辺を user に限定する。到達不能の反例は、探索済みの候補から許可辺で到達できる範囲が閉じている場合に確定する。完全探索で評価対象が空なら VACUOUS、探索の打ち切りで評価対象や真偽が未確定なら EXPLORATION_LIMIT。反例は最短の初期状態からの接頭辞を優先し、同長時は探索順で選ぶ。到達性反例には目標へ進めない起点と探索範囲を記録する。"
impl.lang = "ts"

[func.resolveScope]
intent = "要求スコープと宣言された対象から実行対象を決定する。"
input = ["schema.RunSelection"]
output = ["schema.RunContext", "schema.NotEvaluated"]
design_notes = "通常実行は宣言済み全対象。指定外は NOT_REQUESTED。明示的に要求された対象が実行できなければ BLOCKED として残す。空の明示スコープは入力エラーとして扱う。"
impl.lang = "ts"

[func.aggregateResults]
intent = "有効な証拠、対象別判定、未評価情報を使って全体判定と終了コードを組み立てる。"
input = ["schema.RunResults"]
output = ["schema.Report"]
design_notes = "model の CONFIRMED は有効な MODEL_COUNTEREXAMPLE、implementation の CONFIRMED は有効な INDEPENDENT_ORACLE を要する。観測不一致は conformance の INCONCLUSIVE。証拠の依存先ごとに健全性を判断し、未完了の要求は INCONCLUSIVE、実行障害は ERROR とする。優先順は CONFIRMED > ERROR > FLAKY > INCONCLUSIVE > PASS。終了コードは順に 1 / 3 / 2 / 2 / 0。別対象のエラー・未評価項目と、反例・元観測・再実行結果をすべて保持する。証拠・反例・再実行結果は CheckResult 内の参照に加え、FR-25 に従いレポート直下の evidence / counterexamples / replayResults にも集約する。"
impl.lang = "ts"

[func.runCli]
intent = "Node.js CLI から DSL または spec.json と実行設定を受け取り、report.json と終了コードを出力する。"
input = ["schema.RunScope"]
output = ["schema.Report"]
design_notes = "Phase 1 の model スコープはブラウザー依存なしで動作する。入力検証・実行失敗時も診断と未評価対象を出力する。"
impl.lang = "ts"

[mod.specification]
purpose = "型付き DSL、JSON IR と入力検証。FR-01〜06。"
schemas = ["schema.Scalar", "schema.JsonValue", "schema.StateVariable", "schema.StateValue", "schema.AbstractState", "schema.Expression", "schema.Event", "schema.UpdateMap", "schema.Transition", "schema.GuardEventKind", "schema.Property", "schema.AnalysisLimits", "schema.UxSpec", "schema.DslDefinition"]
funcs = ["func.compileSpec", "func.validateSpec"]
pipeline = ["func.compileSpec -> func.validateSpec"]

[mod.model]
purpose = "ブラウザー非依存の状態遷移、探索、プロパティ検査。FR-07〜10、AC-01・06。"
schemas = ["schema.ModelStep", "schema.ModelGraph"]
funcs = ["func.evaluateExpression", "func.expandState", "func.exploreModel", "func.checkProperties"]
pipeline = ["func.exploreModel -> func.checkProperties"]

[mod.reporting]
purpose = "検証スコープ、判定、証拠を集約して機械可読レポートを生成する。FR-19〜26、AC-10。"
schemas = ["schema.Target", "schema.Verdict", "schema.Cause", "schema.RunScope", "schema.RunSelection", "schema.RunContext", "schema.Coverage", "schema.Diagnostic", "schema.Observation", "schema.Counterexample", "schema.ReplayResult", "schema.Evidence", "schema.CheckResult", "schema.NotEvaluated", "schema.RunResults", "schema.TargetResult", "schema.Report"]
funcs = ["func.resolveScope", "func.aggregateResults"]

[mod.cli]
purpose = "Phase 1 のモデル検査と Phase 3 のランタイム検査を同じスコープ指定と終了コードで CI から実行する。NFR-07。"
funcs = ["func.runCli"]
boundary = { cli = ["Tidal CLI", "report.json"] }
