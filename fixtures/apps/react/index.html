<!doctype html>
<html>
<head><meta charset="utf-8"><title>draft-retention react</title></head>
<body>
<div id="app"></div>
<script type="module">
import React, { useState, useEffect } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
import htm from "https://esm.sh/htm@3.1.1";

const html = htm.bind(React.createElement);
const KEY = "tidal-draft";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{"draft":"","saved":false}'); }
  catch { return { draft: "", saved: false }; }
}

function App() {
  const [s, setS] = useState(load);
  useEffect(() => { localStorage.setItem(KEY, JSON.stringify(s)); }, [s]);
  const status = s.draft === "" ? "empty" : s.saved ? "saved" : "dirty";
  return html`
    <div>
      <input data-testid="draft-input" value=${s.draft}
        onInput=${(e) => setS({ draft: e.target.value, saved: false })} />
      <button data-testid="save-button" onClick=${() => setS((p) => ({ ...p, saved: true }))}>save</button>
      <button data-testid="discard-button" onClick=${() => setS({ draft: "", saved: false })}>discard</button>
      <span data-testid="draft-status">${status}</span>
    </div>`;
}

createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
