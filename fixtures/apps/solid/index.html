<!doctype html>
<html>
<head><meta charset="utf-8"><title>draft-retention solid</title></head>
<body>
<div id="app"></div>
<script type="module">
import { createSignal, createEffect, createRoot } from "https://esm.sh/solid-js@1.9.3";

const KEY = "tidal-draft";

function App() {
  const [s, setS] = createSignal(
    JSON.parse(localStorage.getItem(KEY) || '{"draft":"","saved":false}')
  );
  createEffect(() => localStorage.setItem(KEY, JSON.stringify(s())));

  const root = document.createElement("div");
  const input = document.createElement("input");
  input.setAttribute("data-testid", "draft-input");
  const save = document.createElement("button");
  save.setAttribute("data-testid", "save-button");
  save.textContent = "save";
  const discard = document.createElement("button");
  discard.setAttribute("data-testid", "discard-button");
  discard.textContent = "discard";
  const status = document.createElement("span");
  status.setAttribute("data-testid", "draft-status");
  root.append(input, save, discard, status);

  input.addEventListener("input", (e) => setS({ draft: e.target.value, saved: false }));
  save.addEventListener("click", () => setS((p) => ({ ...p, saved: true })));
  discard.addEventListener("click", () => setS({ draft: "", saved: false }));

  createEffect(() => {
    input.value = s().draft;
    status.textContent = s().draft === "" ? "empty" : s().saved ? "saved" : "dirty";
  });
  return root;
}

createRoot(() => {
  document.getElementById("app").appendChild(App());
});
</script>
</body>
</html>
